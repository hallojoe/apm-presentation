name: Deploy presentation to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript
        run: |
          node --check slides.js
          node --check app.js
      - uses: actions/configure-pages@v5
      - name: Stage public assets
        run: |
          mkdir _site
          cp index.html style.css slides.js app.js _site/
          cp -r assets _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Wait for Pages artifact visibility
        uses: actions/github-script@v7
        with:
          script: |
            for (let attempt = 0; attempt < 12; attempt++) {
              const { data } = await github.rest.actions.listWorkflowRunArtifacts({
                ...context.repo, run_id: context.runId
              });
              if (data.artifacts.some(a => a.name === 'github-pages')) return;
              await new Promise(resolve => setTimeout(resolve, 5000));
            }
            core.setFailed('Pages artifact did not become visible within 60 seconds.');
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
